services:
  backend:
    build:
      context: ./app/backend
    environment:
      BOILERPLATE_PRIMARY_ENV: local
      BOILERPLATE_SERVER_PORT: "8080"
      BOILERPLATE_SERVER_READ_TIMEOUT: "30"
      BOILERPLATE_SERVER_WRITE_TIMEOUT: "30"
      BOILERPLATE_SERVER_IDLE_TIMEOUT: "120"
      BOILERPLATE_SERVER_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      BOILERPLATE_DATABASE_HOST: postgres
      BOILERPLATE_DATABASE_PORT: "5432"
      BOILERPLATE_DATABASE_USER: postgres
      BOILERPLATE_DATABASE_PASSWORD: postgres
      BOILERPLATE_DATABASE_NAME: ai_research
      BOILERPLATE_DATABASE_SSL_MODE: disable
      BOILERPLATE_DATABASE_MAX_OPEN_CONNS: "10"
      BOILERPLATE_DATABASE_MAX_IDLE_CONNS: "5"
      BOILERPLATE_DATABASE_CONN_MAX_LIFETIME: "300"
      BOILERPLATE_DATABASE_CONN_MAX_IDLE_TIME: "60"
      BOILERPLATE_REDIS_ADDRESS: redis:6379
      BOILERPLATE_AUTH_SECRET_KEY: ""
      BOILERPLATE_INTEGRATION_RESEND_API_KEY: ""
      BOILERPLATE_AI_BASE_URL: http://ai:8090
      BOILERPLATE_AI_REQUEST_TIMEOUT_SEC: "120"
      BOILERPLATE_AI_STREAM_IDLE_SEC: "60"
      BOILERPLATE_AI_SESSION_TTL_HOURS: "24"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      ai:
        condition: service_started

  ai:
    build:
      context: ./app/ai
    environment:
      AI_SERVICE_HOST: 0.0.0.0
      AI_SERVICE_PORT: "8090"
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:latest}
      CHROMA_PATH: /data/chroma
      RESEARCH_DATA_DIR: /app/data
    ports:
      - "8090:8090"
    volumes:
      - chroma_data:/data/chroma
    depends_on:
      ollama:
        condition: service_started

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ai_research
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_research"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  chroma_data:
  ollama_data:
